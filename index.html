<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shubh Laabh Creations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one mobile column (max 480px) — brand header with toran edge, scrolling body, docked bottom nav with a raised Scan action */
:root{
  --bg:#ECE7E0; --app:#FAF8F5; --surface:#FFFFFF; --sunk:#F3EFE9; --ink:#1D2528; --muted:#6B6661; --line:#E3DBD0;
  --peacock:#0D5561; --peacock-ink:#0A4650; --peacock-soft:#DDEBEC;
  --marigold:#D48A22; --marigold-soft:#FBEBD2; --marigold-ink:#2A1A05;
  --kumkum:#A3314A; --kumkum-soft:#F7E0E5;
  --ok:#2B7549; --ok-soft:#DEF0E4; --warn:#9A5B00; --warn-soft:#FCEBCB; --bad:#B3302A; --bad-soft:#F8DDDA;
  --on-accent:#FFFFFF; --scrim:rgba(20,16,12,.45); --wa:#1E9E50;
  --exh-bg:#0A3C44; --exh-tile:rgba(255,255,255,.07); --exh-line:rgba(255,255,255,.14); --exh-ink:#F4EFE6; --exh-muted:#A9C3C4;
  --shadow:0 1px 2px rgba(40,30,20,.06),0 8px 24px rgba(40,30,20,.08);
  --f-display:'Marcellus','Cormorant Garamond',Georgia,serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#081012; --app:#0F181A; --surface:#162124; --sunk:#121C1E; --ink:#ECE6DC; --muted:#9AA3A1; --line:#25343A;
  --peacock:#4BA9B0; --peacock-ink:#8ED0D4; --peacock-soft:#143439;
  --marigold:#E8A743; --marigold-soft:#3A2B13; --marigold-ink:#1E1304;
  --kumkum:#E5788E; --kumkum-soft:#3A1C24;
  --ok:#62C68D; --ok-soft:#14301F; --warn:#EDB04E; --warn-soft:#382A12; --bad:#F27E73; --bad-soft:#3A1A17;
  --on-accent:#081012; --scrim:rgba(0,0,0,.6);
  --exh-bg:#06272C; --exh-tile:rgba(255,255,255,.06); --exh-line:rgba(255,255,255,.12); --exh-ink:#F1ECE3; --exh-muted:#94B5B7;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#081012; --app:#0F181A; --surface:#162124; --sunk:#121C1E; --ink:#ECE6DC; --muted:#9AA3A1; --line:#25343A;
  --peacock:#4BA9B0; --peacock-ink:#8ED0D4; --peacock-soft:#143439;
  --marigold:#E8A743; --marigold-soft:#3A2B13; --marigold-ink:#1E1304;
  --kumkum:#E5788E; --kumkum-soft:#3A1C24;
  --ok:#62C68D; --ok-soft:#14301F; --warn:#EDB04E; --warn-soft:#382A12; --bad:#F27E73; --bad-soft:#3A1A17;
  --on-accent:#081012; --scrim:rgba(0,0,0,.6);
  --exh-bg:#06272C; --exh-tile:rgba(255,255,255,.06); --exh-line:rgba(255,255,255,.12); --exh-ink:#F1ECE3; --exh-muted:#94B5B7;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
@media (min-width:520px){body{background-image:radial-gradient(var(--line) 1px,transparent 1.6px);background-size:18px 18px}}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--marigold);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.ic{width:22px;height:22px;flex:none}
.mono{font-family:var(--f-mono);font-weight:500;letter-spacing:.02em}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--app);position:relative;overflow:hidden}
@media (min-width:520px){#app{box-shadow:0 0 0 1px var(--line),0 24px 70px rgba(0,0,0,.14)}}
main{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
.pad{padding:16px 16px 24px}
.stack{display:flex;flex-direction:column;gap:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Brand header */
.brand{background:var(--peacock-ink);color:#F6F0E6;padding:18px 16px 14px;position:relative}
.brand-row{display:flex;align-items:center;gap:12px}
.emblem{width:44px;height:44px;color:var(--marigold);flex:none}
.brand-name{font-family:var(--f-display);font-size:21px;letter-spacing:.08em;line-height:1.1}
.brand-sub{font-size:12px;opacity:.82;margin-top:3px;letter-spacing:.02em}
.brand-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pill-dark{font-size:11.5px;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.1);display:inline-flex;align-items:center;gap:6px}
.pill-dark .ic{width:14px;height:14px}
.dot{width:7px;height:7px;border-radius:50%;background:#7BD9A0;display:inline-block}
.dot.busy{background:#F2C14E;animation:pulse 1s infinite}
.toran-edge{height:9px;background:radial-gradient(circle at 9px 0,var(--marigold) 5.5px,transparent 6px) 0 0/18px 9px repeat-x}
.brand + .toran-edge{background-color:transparent}

/* Top bar */
.top{position:sticky;top:0;z-index:5;background:var(--app);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 8px;min-height:58px}
.top-title{flex:1;min-width:0;padding-left:6px}
.top-title h1{font-family:var(--f-display);font-size:20px;font-weight:400;letter-spacing:.01em}
.top-title p{font-size:12px;color:var(--muted)}
.top .emblem{width:30px;height:30px;color:var(--marigold)}
.icon-btn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.icon-btn:hover{background:var(--sunk)}

/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:13px;font-weight:650;font-size:15.5px;width:100%;text-align:center;transition:transform .08s,filter .15s}
.btn:active:not(:disabled){transform:scale(.985)}
.btn-primary{background:var(--peacock);color:var(--on-accent)}
.btn-gold{background:var(--marigold);color:var(--marigold-ink)}
.btn-wa{background:var(--wa);color:#fff}
a.btn{text-decoration:none}
.btn-ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn-xl{min-height:60px;font-size:17px;letter-spacing:.02em}
.btn:disabled{opacity:.42}
.btn .ic{width:20px;height:20px}
.link{color:var(--peacock);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.link .ic{width:16px;height:16px}

/* Home */
.scan-hero{display:flex;align-items:center;gap:14px;width:100%;padding:18px;border-radius:18px;background:var(--marigold);color:var(--marigold-ink);box-shadow:var(--shadow);position:relative;overflow:hidden}
.scan-hero::after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;border:16px solid rgba(255,255,255,.18)}
.scan-hero-ic{width:58px;height:58px;border-radius:16px;background:rgba(255,255,255,.3);display:grid;place-items:center;flex:none}
.scan-hero-ic .ic{width:30px;height:30px}
.scan-hero-txt{flex:1;display:flex;flex-direction:column}
.scan-hero-txt strong{font-size:21px;letter-spacing:.06em;text-transform:uppercase;font-weight:800}
.scan-hero-txt small{font-size:13px;opacity:.85}
.tile-btn{display:flex;align-items:center;gap:10px;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px}
.tile-btn .ic{color:var(--peacock)}
.principle{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);padding:10px 12px;border-radius:12px;background:var(--peacock-soft)}
.principle b{color:var(--peacock-ink)}
.principle .ic{color:var(--peacock);width:18px;height:18px;margin-top:1px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:6px}
.sec-h h2{font-family:var(--f-display);font-weight:400;font-size:19px}
.sec-h .link,.sec-h span{font-size:13px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;text-align:left;width:100%}
.kpi-main{grid-column:span 2;background:var(--peacock);border-color:transparent;color:var(--on-accent)}
.k-l{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;opacity:.75}
.k-v{font-size:28px;font-weight:750;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi-main .k-v{font-size:34px}
.k-s{font-size:12px;opacity:.75}
.kpi-warn{border-left:4px solid var(--warn)}
.kpi-warn .k-v{color:var(--warn)}
.kpi-bad{border-left:4px solid var(--bad)}
.kpi-bad .k-v{color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;border-top:1px solid var(--line)}
.list-row:first-child{border-top:0}
button.list-row:hover{background:var(--sunk)}
.lr-main{flex:1;min-width:0;display:flex;flex-direction:column}
.lr-main b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr-main small{color:var(--muted);font-size:12.5px}
.lr-end{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-variant-numeric:tabular-nums}
.thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none;background:var(--sunk)}
.pay{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.bar-track{height:6px;border-radius:3px;background:var(--sunk);margin-top:6px;overflow:hidden}
.bar-track i{display:block;height:100%;background:var(--marigold);border-radius:3px}
.log-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.log-ic .ic{width:18px;height:18px}
.log-sale{background:var(--peacock-soft);color:var(--peacock)}
.log-in{background:var(--ok-soft);color:var(--ok)}
.log-out{background:var(--bad-soft);color:var(--bad)}
.log-new{background:var(--marigold-soft);color:var(--warn)}
.delta-neg{color:var(--bad);font-weight:700}
.delta-pos{color:var(--ok);font-weight:700}

/* Status badges */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-low{background:var(--warn-soft);color:var(--warn)}
.b-out{background:var(--bad-soft);color:var(--bad)}
.b-ok::before,.b-out::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

/* Scan */
.vf{position:relative;aspect-ratio:1/1;max-height:36vh;width:100%;margin-inline:auto;max-width:100%;border-radius:20px;overflow:hidden;background:radial-gradient(120% 90% at 30% 20%,#5b2a26,#1f0f0e);color:#f3e9dc}
.vf img,.vf video{width:100%;height:100%;object-fit:cover;display:block}
.vf-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:14px;opacity:.85;text-align:center;padding:20px}
.vf-empty .ic{width:46px;height:46px;opacity:.7}
.vf .c{position:absolute;width:34px;height:34px;border:3px solid var(--marigold)}
.vf .tl{top:14px;left:14px;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
.vf .tr{top:14px;right:14px;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
.vf .bl{bottom:14px;left:14px;border-right:0;border-top:0;border-radius:0 0 0 10px}
.vf .br{bottom:14px;right:14px;border-left:0;border-top:0;border-radius:0 0 10px 0}
.vf-tag{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:5px 10px;border-radius:999px;white-space:nowrap}
.vf-tag.warn{background:rgba(179,48,42,.85)}
.vf-torch{position:absolute;top:14px;right:56px;width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;font-size:20px;display:grid;place-items:center}
.vf-torch.on{background:#E8A743;color:#1E1304}
.ref-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.ref{position:relative}.ref img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block}
.ref button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--app);font-size:14px;line-height:1;display:grid;place-items:center}
.rate-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.steps-list{margin:0;padding-left:18px;font-size:13.5px;display:flex;flex-direction:column;gap:5px}
.guide{position:absolute;left:15%;top:50%;width:70%;aspect-ratio:1;transform:translateY(-50%);border:2px dashed rgba(255,255,255,.9);border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.4);pointer-events:none}
.cat-bar{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.cat{flex:none;padding:12px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:14.5px;white-space:nowrap}
.cat.on{background:var(--peacock);border-color:var(--peacock);color:var(--on-accent)}
.recent .k-l{display:block;margin-bottom:6px;color:var(--muted)}
.recent-row{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.rc{display:flex;flex-direction:column;gap:3px;font-size:11px;line-height:1.2;text-align:center;color:var(--ink);min-width:0}
.rc img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.rc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc:disabled{opacity:.4}
.added-bar{display:grid;grid-template-columns:44px 1fr auto;gap:8px 10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--ok-soft);border:1px solid var(--ok)}
.ab-qty{grid-column:1 / -1;display:flex;align-items:center;gap:10px;font-size:13px}.ab-qty b{margin-left:auto;font-variant-numeric:tabular-nums}
.added-bar img{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none}
.ab-main{flex:1;min-width:0;display:flex;flex-direction:column}
.ab-main b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-main small{color:var(--muted);font-size:12px}
.ab-undo{flex:none;padding:9px 12px;border-radius:10px;background:var(--ink);color:var(--app);font-weight:700;font-size:13px}
.auto-row{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.auto-row input{width:20px;height:20px;margin-top:2px;accent-color:var(--peacock)}
.auto-row span{display:flex;flex-direction:column}.auto-row small{color:var(--muted);font-size:12.5px}
.scanline{position:absolute;left:0;right:0;height:70px;top:-70px;background:linear-gradient(180deg,transparent,rgba(232,167,67,.45),transparent);animation:scan 1.4s linear infinite}
.is-analysing img{filter:saturate(.8) brightness(.85)}
@keyframes scan{to{top:100%}}
@keyframes pulse{50%{opacity:.35}}
@keyframes spin{to{transform:rotate(360deg)}}
.cam-actions{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.shutter{width:76px;height:76px;border-radius:50%;background:var(--marigold);border:5px solid var(--surface);box-shadow:0 0 0 2px var(--marigold),var(--shadow);display:grid;place-items:center;color:var(--marigold-ink)}
.shutter .ic{width:30px;height:30px}
.cam-side{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.cam-side .icon-btn{background:var(--surface);border:1px solid var(--line)}
.samples{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sample{display:flex;flex-direction:column;gap:5px;font-size:12px;line-height:1.25;color:var(--muted);text-align:left}
.sample img{width:100%;aspect-ratio:1;border-radius:12px;object-fit:cover;border:2px solid transparent;transition:border-color .15s}
.sample:hover img{border-color:var(--marigold)}
.sample b{color:var(--ink);font-weight:600}
.hint{font-size:12.5px;color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.steps li.done{color:var(--ink)}
.steps li.done .ic{color:var(--ok);width:18px;height:18px}
.steps li.now{color:var(--ink);font-weight:600}
.spinner{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--marigold);animation:spin .8s linear infinite;flex:none}
.pend{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none}
.analysing-h{font-family:var(--f-display);font-size:22px}
.compare{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.compare figure{margin:0;display:flex;flex-direction:column;gap:5px}
.compare img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;border:1px solid var(--line)}
.compare figcaption{font-size:11.5px;color:var(--muted);text-align:center}
.cmp-arrow{color:var(--muted)}
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.eyebrow .ic{width:16px;height:16px}
.eyebrow.ok{color:var(--ok)}
.eyebrow.warn{color:var(--warn)}
.pname{font-family:var(--f-display);font-weight:400;font-size:23px;line-height:1.2;margin:6px 0 10px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:0}
.facts div{display:flex;flex-direction:column;gap:1px;min-width:0}
.facts dt{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.facts dd{margin:0;font-weight:650;font-size:16px;font-variant-numeric:tabular-nums}
.conf{margin-top:14px}
.conf-top{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.conf-top b{color:var(--ink);font-size:15px}
.bar{height:8px;border-radius:4px;background:var(--sunk);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--ok)}
.bar.mid i{background:var(--warn)}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;font-size:13.5px}
.note .ic{width:20px;height:20px;margin-top:1px}
.note.warn{background:var(--warn-soft);color:var(--ink)}
.note.warn .ic{color:var(--warn)}
.note.info{background:var(--peacock-soft)}
.note.info .ic{color:var(--peacock)}
.note.ok{background:var(--ok-soft)}
.note.ok .ic{color:var(--ok)}
.note.bad{background:var(--bad-soft)}
.note.bad .ic{color:var(--bad)}
.ask{font-size:17px;font-weight:700;text-align:center;margin-top:4px}
.opt{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center;width:100%;padding:10px;border-radius:16px;background:var(--surface);border:2px solid var(--line);position:relative;text-align:left}
.opt.on{border-color:var(--peacock);background:var(--peacock-soft)}
.opt img{width:76px;height:76px;border-radius:12px;object-fit:cover}
.opt-body{display:flex;flex-direction:column;gap:2px;min-width:0}
.opt-body b{font-weight:650;line-height:1.25}
.opt-k{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.opt-meta{font-size:12.5px;color:var(--muted)}
.opt-end{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-variant-numeric:tabular-nums}
.opt-end b{font-size:16px}
.opt-end small{font-size:11.5px;color:var(--muted)}

const CURRENCIES = {
  INR:{sym:'₹',name:'Indian rupee',dp:0},   USD:{sym:'$',name:'US dollar',dp:2},      GBP:{sym:'£',name:'British pound',dp:2},
  EUR:{sym:'€',name:'Euro',dp:2},           CNY:{sym:'¥',name:'Chinese yuan',dp:2},   AED:{sym:'AED ',name:'UAE dirham',dp:2},
  SGD:{sym:'S$',name:'Singapore dollar',dp:2}, AUD:{sym:'A$',name:'Australian dollar',dp:2}, CAD:{sym:'C$',name:'Canadian dollar',dp:2},
  JPY:{sym:'JP¥',name:'Japanese yen',dp:0}

/* ---------- storage (local today; cloud DB / Google Sheets later) ---------- */
const Store = {
  load(){ try{ const r=localStorage.getItem(KEY); return r?JSON.parse(r):null; }catch(e){ return null; } },

  DB.products=DB.products.filter(p=>!gone.has(p.serial));

const imgCache = {};
const Products = {
  all(){ return DB.products; },
  get(s){ return DB.products.find(p=>p.serial===+s); },
  nextSerial(){ return Math.max(0,...DB.products.map(p=>p.serial))+1; },
  status(p){ return p.stock<=0 ? 'out' : p.stock<=LOW ? 'low' : 'ok'; },
  hasPhoto(p){ return !!(p && (p.photo || (p.refImgs||[]).length)); },
  img(p){ if(!p) return ''; if(p.photo) return p.photo; const k=JSON.stringify(p.art); return imgCache[k] || (imgCache[k]=svgURI(artSVG(p.art))); },
  lookalikes(p){ return p && p.group ? DB.products.filter(x=>x.group===p.group && x.serial!==p.serial) : []; },
  search(q){
    q=q.trim().toLowerCase(); if(!q) return DB.products.slice();

/* ---------- On-device image matcher ----------
   Removes the plain background, then compares (1) colour histogram of the
   object, (2) edge-direction pattern (shape/texture), (3) light/dark layout and
   silhouette. Each product can hold several reference photos; every photo the
   seller confirms is added as a new reference, so matching improves with use.
   Real version: replace imgFeatures/similarity with an image-embedding model

/* Draw a photo into a square canvas: centre crop, whole frame, or zoomed; optionally mirrored or "made dim" */
async function prepCanvas(src,{mode='center',size=224,flip=false,dim=false,enhance=true}={}){
  const im=await loadImg(src); const w=im.naturalWidth||im.width||size, h=im.naturalHeight||im.height||size;
  const c=document.createElement('canvas'); c.width=c.height=size; const x=c.getContext('2d',{willReadFrequently:true});

  if(dim) x.filter='blur(1px)';
  if(mode==='full'){ const k=size/Math.max(w,h); x.drawImage(im,(size-w*k)/2,(size-h*k)/2,w*k,h*k); }
  else { const k=Math.min(w,h)*(mode==='zoom'?.72:1); x.drawImage(im,(w-k)/2,(h-k)/2,k,k,0,0,size,size); }
  x.setTransform(1,0,0,1,0,0); x.filter='none';

/* Brightness (0–1) and sharpness of a photo, used for hints and for picking the sharpest camera frame */

  const c=await prepCanvas(src,{mode:'full',size:128,enhance:false}), d=c.getContext('2d').getImageData(0,0,128,128).data, N=128;
  const L=new Float32Array(N*N); let mean=0; for(let i=0;i<N*N;i++){ L[i]=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2]; mean+=L[i]; } mean/=N*N;

async function enhancedURL(src){ const c=await prepCanvas(src,{mode:'full',size:320}); return c.toDataURL('image/jpeg',.9); }

function loadScript(src){ return new Promise((res,rej)=>{ const sc=document.createElement('script'); sc.src=src; sc.onload=res; sc.onerror=()=>rej(new Error('load '+src)); document.head.appendChild(sc); }); }
/* ---------- AI image model: DINOv2 (small), runs inside the browser ----------
   Turns any photo into a 384-number "fingerprint" of the OBJECT (its shape, parts, texture).
   DINOv2 is trained to tell individual objects apart, so two photos of the same power bank
   give similar fingerprints, while a bottle or a pen give very different ones.
   Needs internet the first time (≈23 MB, then cached by the browser).
   Without it, the simple colour/shape matcher is used. */
/* Fixed random projection 384 → 64 for the 256 detail patches (keeps them small enough to store) */
const PROJ = (()=>{ const r=mulberry32(42), m=new Float32Array(384*64); for(let i=0;i<m.length;i++){ const u=Math.max(1e-9,r()), v=r(); m[i]=Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); } return m; })();

const AI = {
  ext:null, T:null, p:null, state:'idle',      // idle | loading | ready | off
  load(){
    if(this.p) return this.p;
    this.state='loading';
    this.p=(async()=>{
      const T=this.T=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.5');
      try{ if(self.crossOriginIsolated) T.env.backends.onnx.wasm.numThreads=Math.min(4,navigator.hardwareConcurrency||2); }catch(e){}
      // "Fast": graphics chip (WebGPU), ~0.5 s per scan.  "Precise": processor (multi-core), ~1 s per scan,
      // measured slightly better on near-identical look-alikes. Chosen in More → Scanner accuracy test.
      try{ const ad=(DB.settings.aiMode||'fast')==='fast' && navigator.gpu && await navigator.gpu.requestAdapter(); if(!ad) throw 0;
        this.ext=await T.pipeline('image-feature-extraction','onnx-community/dinov2-small',{device:'webgpu',dtype:'fp16'}); this.device='gpu'; }
      catch(e){ this.ext=await T.pipeline('image-feature-extraction','onnx-community/dinov2-small',{dtype:'q8'}); this.device='cpu'; }
      const warm=document.createElement('canvas'); warm.width=warm.height=224;
      for(let i=0;i<3;i++) await this.embedCanvas(warm,false);   // first runs compile the model; done at startup, not during a scan
      this.state='ready'; return this.ext;
    })().catch(e=>{ console.warn('AI model unavailable:',e); this.state='off'; return null; });
    return this.p;
  },
  withTimeout(ms){ return Promise.race([this.load(), wait(ms).then(()=>null)]); },
  /* g = whole-object fingerprint (384 numbers); p = 16×16 grid of detail descriptors (logos, text, pattern, edges) */
  async embedCanvas(c,withPatches){
    const img = this.T.RawImage && this.T.RawImage.fromCanvas ? this.T.RawImage.fromCanvas(c) : c.toDataURL('image/jpeg',.92);
    const d=(await this.ext(img)).data;

    // so the fingerprint describes the ITEM, not the surface it was photographed on.
    const N=256, Dm=384, pn=new Float32Array(N*Dm), border=new Float32Array(Dm);

  async embedViews(src,views){

/* Detail check: match the 16×16 detail patches of two photos. Patches that are each other's best

function detailScore(Q,R,Wq){

  for(let i=0;i<N;i++){ if(!tex[i]) continue; const j=bq[i]; if(br[j]!==i || vq[i]<.5) continue;

/* Saved fingerprints (IndexedDB): each catalogue photo is processed once, ever, not on every page load */
function hashStr(t){ let h=2166136261; for(let i=0;i<t.length;i+=5){ h^=t.charCodeAt(i); h=Math.imul(h,16777619); } return (h>>>0).toString(36)+'_'+t.length; }
const FPCache = {
  open(){ return this._o || (this._o=new Promise(res=>{ try{ const r=indexedDB.open('slc-fingerprints',1); r.onupgradeneeded=()=>r.result.createObjectStore('fp'); r.onsuccess=()=>res(r.result); r.onerror=()=>res(null); }catch(e){ res(null); } })); },
  async get(k){ const d=await this.open(); if(!d) return null; return new Promise(res=>{ try{ const q=d.transaction('fp').objectStore('fp').get(k); q.onsuccess=()=>res(q.result||null); q.onerror=()=>res(null); }catch(e){ res(null); } }); },
  async set(k,v){ const d=await this.open(); if(!d) return; try{ d.transaction('fp','readwrite').objectStore('fp').put(v,k); }catch(e){} },
  async clear(){ const d=await this.open(); if(!d) return; await new Promise(res=>{ try{ const t=d.transaction('fp','readwrite'); t.objectStore('fp').clear(); t.oncomplete=res; t.onerror=res; }catch(e){ res(); } }); }

const dot=(a,b)=>{ let s=0; for(let i=0;i<a.length;i++) s+=a[i]*b[i]; return s; };
const STOP=new Set(['with','and','the','set','of','for','in','handmade','decorative','premium','large','mini']);
const words=t=>String(t).toLowerCase().split(/[^a-z]+/).filter(w=>w.length>=4&&!STOP.has(w));

/* ---------- Matcher ----------
   Each product holds several references: its catalogue image (photo or illustration)
   plus every real photo the seller has confirmed for it ("learning from confirmations"). */
const Matcher = {
  idx:{}, _p:null, done:0, total:0,
  ready(){ return this._p || (this._p=(async()=>{
    const m=await AI.withTimeout(25000);
    if(!m && AI.state==='loading') AI.load().then(x=>{ if(x){ this.reset(); this.ready(); } });   // slow network: re-index once the model arrives
    const list=DB.products.filter(Products.hasPhoto); this.total=list.length; this.done=0;
    for(const p of list){ await this.indexProduct(p); this.done++; }
  })()); },
  reset(){ this.idx={}; this._p=null; },
  /* views of each catalogue photo: normal (+detail patches), simulated dim light, mirrored, whole frame */
  async ref(src,kind){
    const r={kind, embs:[], patches:null};
    if(AI.state==='ready'){
      const views=[{mode:'center',patches:true},{mode:'center',dim:true},{mode:'center',flip:true},{mode:'full'}];
      const key='v4|'+AI.device+'|'+hashStr(src); let c=await FPCache.get(key);
      if(!c){ const e=await AI.embedViews(src,views); if(e){ c={g:e.map(x=>x.g), p:e[0].p, w:e[0].w}; FPCache.set(key,c); } }
      if(c){ r.embs=c.g; r.patches=c.p instanceof Float32Array ? c.p : (c.p?new Float32Array(c.p):null); r.w=c.w||null; }
    } else { try{ r.hand=await imgFeatures(await enhancedURL(src)); }catch(e){} }
    return r;
  },
  async indexProduct(p){
    if(!Products.hasPhoto(p)){ delete this.idx[p.serial]; return; }   // drawings are never used for scanning
    const list=[];
    if(p.photo) list.push(await this.ref(p.photo,'photo'));
    for(const t of (p.refImgs||[])) list.push(await this.ref(t,'photo'));
    this.idx[p.serial]=list;
  },
  /* fingerprint ranking; opts.category limits the search, opts.exclude hides one photo (accuracy test) */
  rank(q,opts={}){
    const out=[];
    for(const p of DB.products){
      const refs=this.idx[p.serial]; if(!refs || !refs.length) continue;
      if(opts.category && p.category!==opts.category) continue;
      let best=0, bestRef=-1, second=-1, secondVal=0;
      refs.forEach((r,ri)=>{
        if(opts.exclude && opts.exclude.serial===p.serial && opts.exclude.ref===ri) return;
        let c=0;
        if(q.gs && r.embs.length){ for(const a of q.gs) for(const b of r.embs){ const v=dot(a,b); if(v>c) c=v; } }
        else if(q.hand && r.hand) c=similarity(q.hand,r.hand)*.85;

      out.push({serial:p.serial, g:best, refs:[bestRef,second].filter(i=>i>=0)});

  },
  detail(c,qp,qw){
    if(!qp) return null; let best=null;
    for(const ri of c.refs){ const r=this.idx[c.serial][ri]; /* the two closest photos of that product */ if(!r || !r.patches) continue; const d=detailScore(qp,r.patches,qw); if(!best || d.score>best.score) best=d; }
    return best;
  },
  async learn(serial,photo,feat){
    const p=Products.get(serial); if(!p||!photo) return null;
    let thumb; try{ thumb=await downscale(photo,240); }catch(e){ return null; }
    p.refImgs=(p.refImgs||[]).concat([thumb]).slice(-5);
    if(feat) p.refs=(p.refs||[]).concat([feat]).slice(-5);

  },
  unlearn(serial,thumb){ const p=Products.get(serial); if(!p||!thumb) return; const i=(p.refImgs||[]).lastIndexOf(thumb); if(i>=0){ p.refImgs.splice(i,1); save(); this.indexProduct(p); } }
};

/* ---------- Recognition ----------
   Demo photos use scripted answers so the presentation is repeatable.
   Real camera/uploaded photos go through the AI model + Matcher above.
   "Product identified" is shown only when the best match is backed by a REAL photo of that
   product and is clearly ahead of the next one. Otherwise the seller is asked to choose. */
const Recognition = {
  W:.6,   // weight of the detail check in the final score
  /* decide from a query fingerprint; shared by live scanning and the accuracy test */
  decide(q,opts={}){
    const ranked=Matcher.rank(q,opts); if(!ranked.length) return {candidates:[],confident:false,noMatch:false};
    const useDetail = opts.detail!==false && !!q.p && !(ranked[1] && ranked[0].g-ranked[1].g>=.2);   // clear winner: no need to check details
    const top=ranked.slice(0,3).map(c=>{ const d=useDetail?Matcher.detail(c,q.p,q.w):null; return {serial:c.serial, g:c.g, detail:d?d.score:null, textured:d?d.textured:0}; });
    const plain = !useDetail || top[0].textured<.12;                 // plain item: few details to compare
    top.forEach(c=>{ c.score = c.g + (plain||c.detail==null ? 0 : this.W*c.detail); });
    top.sort((a,b)=>b.score-a.score);
    const [a,b]=top, gapG=b?a.g-b.g:1, gapS=b?a.score-b.score:1, gapD=b&&a.detail!=null&&b.detail!=null?a.detail-b.detail:a.detail||0;
    let confident=false, how='';
    // Measured on the benchmark: every wrong top answer led the runner-up by ≤ 0.07, every lead ≥ 0.10 was right.
    // So "sure" = a real match (≥ 0.45) that clearly beats the next product once details are counted.
    if(q.gs){ if(a.g>=.45 && gapS>=.10){ confident=true; how = plain ? 'fingerprint' : 'details'; } }
    else confident = a.g>=.80 && gapG>=.12;
    const noMatch = !confident && (q.gs ? a.g<.30 : a.g<.5);
    const candidates = top.filter((c,i)=> i===0 || c.score >= (q.gs ? Math.max(.25, a.score-.25) : a.score-.15))
      .map(c=>({serial:c.serial, conf:+Math.min(.99,Math.max(c.g,c.score-.1)).toFixed(2), g:c.g, detail:c.detail, kind:'photo'}));
    return {candidates, confident, noMatch, plain, how};
  },
  async identify(input){
    const t0=performance.now();
    await Matcher.ready();
    const quality=await photoQuality(input.photo);
    // zoomed view matters: items often appear smaller in a scan than in the catalogue photo (+20 points measured)
    const views = input.cropped ? [{mode:'center',patches:true},{mode:'zoom'}] : [{mode:'center',patches:true},{mode:'full'},{mode:'zoom'}];
    const e = AI.state==='ready' ? await AI.embedViews(input.photo,views) : null;
    const feat = e ? null : await imgFeatures(await enhancedURL(input.photo));
    const q={gs:e?e.map(v=>v.g):null, p:e?e[0].p:null, w:e?e[0].w:null, hand:feat};
    const d=this.decide(q,{category:input.category, dark:quality.dark, detail:input.detail});
    return {...d, count:1, feat, emb:!!e, labels:[], quality, ms:Math.round(performance.now()-t0)};
  }
};

/* ---------- Billing ---------- */
const Billing = {
  lines(){ return DB.cart.items.map(i=>({...i, p:Products.get(i.serial)})).filter(l=>l.p); },
  qtyOf(serial){ const i=DB.cart.items.find(x=>x.serial===serial); return i?i.qty:0; },
  intl(){ return (DB.cart.currency||'INR')!=='INR'; },
  rate(p){ const cur=DB.cart.currency||'INR'; if(cur==='INR') return p.price; const r=rates(); return roundTo((+p.priceIntl||0)*r[intlBase()]/r[cur],cur); },
  missingIntl(){ return this.intl() ? this.lines().filter(l=>!(+l.p.priceIntl>0)) : []; },
  subtotal(){ return sum(this.lines(), l=>l.qty*this.rate(l.p)); },
  discount(){ const sub=this.subtotal(), v=DB.cart.discVal||0, r = x=>roundTo(x,DB.cart.currency||'INR'); const d = DB.cart.discType==='pct' ? sub*Math.min(v,100)/100 : v; return Math.max(0,Math.min(sub,r(d))); },
  total(){ return this.subtotal()-this.discount(); },
  add(serial,qty){ const it=DB.cart.items.find(x=>x.serial===serial); if(it) it.qty+=qty; else DB.cart.items.push({serial,qty}); save(); },
  setQty(serial,q){ const it=DB.cart.items.find(x=>x.serial===serial); if(!it) return; it.qty=q; if(q<=0) DB.cart.items=DB.cart.items.filter(x=>x.serial!==serial); save(); },
  /* Only here does stock change: after the seller presses CONFIRM & GENERATE BILL */
  finalize(){
    const lines=this.lines();
    const short=lines.find(l=>l.qty>l.p.stock); if(short) throw new Error(`Only ${short.p.stock} left of No. ${ser(short.p.serial)}`);
    const sub=this.subtotal(), disc=this.discount();
    if(this.missingIntl().length) throw new Error('Add an international price for every product first.');
    const items=lines.map(l=>({serial:l.p.serial,name:l.p.name,size:l.p.size,qty:l.qty,rate:this.rate(l.p),disc:0}));
    splitDiscount(items,disc);
    DB.seq++;
    const sale={no:invoiceNo(DB.seq),date:new Date().toISOString(),customer:DB.cart.customer.trim()||'Walk-in Customer',phone:DB.cart.phone.trim(),email:(DB.cart.email||'').trim(),items,subtotal:sub,discount:disc,discLabel:DB.cart.discType==='pct'&&DB.cart.discVal?DB.cart.discVal+'%':'',total:Math.round((sub-disc)*100)/100,payment:DB.cart.payment,channel:'Exhibition',country:DB.cart.country,currency:DB.cart.currency||'INR',fx:rates()[DB.cart.currency||'INR']||1,stockChanges:[]};
    lines.forEach(l=>{ const from=l.p.stock; l.p.stock-=l.qty; sale.stockChanges.push({serial:l.p.serial,name:l.p.name,from,to:l.p.stock}); Inventory.log('sale',l.p.serial,-l.qty,from,l.p.stock,sale.no); });
    DB.sales.unshift(sale); DB.cart=emptyCart(); save(); SheetSync.push();
    return sale;
  }
};

function normPhone(p,country='India'){
  let d=String(p||'').replace(/\D/g,''); if(d.startsWith('00')) d=d.slice(2);
  const dial=(COUNTRIES[country]||{}).dial||'';
  if(country==='India'){ if(d.length===11 && d[0]==='0') d=d.slice(1); if(d.length===10) d='91'+d; }
  else if(country==='China'){ if(d.length===11 && d[0]==='1') d='86'+d; }
  else if(dial && !d.startsWith(dial)) d=dial+d.replace(/^0+/,'');
  return d.length>=11 && d.length<=15 ? d : '';
}

/* ---------- PDF cache: built when the invoice opens, so WhatsApp can use it instantly ---------- */
const pdfName = s => `Invoice-${s.no.replace(/\//g,'-')}.pdf`;
const PdfCache = { key:'', blob:null, p:null };
const pdfKey = s => [s.no,s.customer,s.phone,s.email,s.country].join('|');
function getPdf(s){
  const k=pdfKey(s);
  if(PdfCache.key===k && PdfCache.blob) return Promise.resolve(PdfCache.blob);
  if(PdfCache.key===k && PdfCache.p) return PdfCache.p;
  PdfCache.key=k; PdfCache.blob=null;
  PdfCache.p=invoicePdf(s).then(b=>{ if(PdfCache.key===k) PdfCache.blob=b; return b; }).catch(e=>{ if(PdfCache.key===k){ PdfCache.key=''; PdfCache.p=null; } throw e; });
  return PdfCache.p;
}
async function savePdf(s,blob){
  blob = blob || await getPdf(s);
  const dl = window.claude && window.claude.use ? await window.claude.use('downloads').catch(()=>null) : null;   // claude.ai viewer
  if(dl){ try{ await dl.save({filename:pdfName(s),data:blob}); return true; } catch(e){ if(e && e.code!=='declined') toast('Could not save the PDF here.'); return false; } }
  const url=URL.createObjectURL(blob), a=document.createElement('a'); a.href=url; a.download=pdfName(s); document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),60000);
  return true;
}

/* Accuracy test: every product with 2+ photos. Each photo in turn is hidden from the catalogue and
   used as the "scan"; the scanner must find the right product from the remaining photos. */
async function accuracyTest(){
  await Matcher.ready();
  if(AI.state!=='ready') throw new Error('the AI model is not loaded');
  const prods=DB.products.filter(p=>(Matcher.idx[p.serial]||[]).filter(r=>r.embs.length).length>=2);
  const methods={global:{label:'Fingerprint only (before)',detail:false},detail:{label:'Fingerprint + detail check (now)',detail:true}};
  const res={}; for(const k in methods) res[k]={n:0,top1:0,top3:0,auto:0,autoWrong:0};
  for(const p of prods){ const refs=Matcher.idx[p.serial];
    refs.forEach((r,ri)=>{ if(!r.embs.length) return;
      const q={gs:[r.embs[0],r.embs[3]].filter(Boolean), p:r.patches, w:r.w};   // catalogue views: normal + whole frame
      for(const k in methods){ const d=Recognition.decide(q,{exclude:{serial:p.serial,ref:ri},detail:methods[k].detail}); const o=res[k]; o.n++;
        const names=d.candidates.map(c=>c.serial); if(names[0]===p.serial) o.top1++; if(names.slice(0,3).includes(p.serial)) o.top3++;
        if(d.confident){ o.auto++; if(names[0]!==p.serial) o.autoWrong++; } }
    }); }
  // live speed: full scans of a few catalogue photos
  const srcs=[]; for(const p of DB.products){ if(p.photo) srcs.push(p.photo); if(srcs.length>=5) break; }
  let ms=0; for(const sP of srcs){ const t=performance.now(); await Recognition.identify({photo:sP,cropped:true}); ms+=performance.now()-t; }
  return {products:prods.length, photos:res.detail.n, methods:Object.keys(methods).map(k=>({...res[k],label:methods[k].label})), avgMs:srcs.length?Math.round(ms/srcs.length):null, at:Date.now()};
}

  const a=S.acc, pc=(x,n)=>n?Math.round(x/n*100)+'%':'–';
  return `${topbar('Scanner accuracy test')}<div class="pad stack">
    <p class="muted">Uses your own catalogue. Each product photo is hidden in turn and scanned against the rest, so every product needs at least 2 photos. Nothing in your bills or stock changes.</p>

      <option value="fast" ${(DB.settings.aiMode||'fast')==='fast'?'selected':''}>Fast: about 0.5 s per scan (uses the graphics chip)</option>
      <option value="precise" ${DB.settings.aiMode==='precise'?'selected':''}>Precise: about 1 s per scan, better on near-identical look-alikes</option></select></label>
      <p class="hint">Now running on: <b>${AI.device==='gpu'?'graphics chip':AI.device==='cpu'?'processor':'loading…'}</b>. Changing the mode restarts the scanner once.</p></div>
    <button class="btn btn-primary btn-xl" data-act="runAccuracy" ${S.accRunning?'disabled':''}>${S.accRunning?'Testing…':ic('spark')+' Run accuracy test'}</button>
    ${a?(a.photos?`<div class="card stack" style="gap:8px"><b>${a.photos} photos of ${a.products} products tested</b>

/* =====================================================================
   ACTIONS
   ===================================================================== */
function startScan(){ S.scan={phase:'camera'}; }
function clearAdded(){ S.lastAdded=null; clearInterval(S.undoT); }
async function analyse(photo,input){
  S.scan={phase:'analysing',photo,step:0};
  render();
  if(S.scanCat && S.scanCat!=='All') input.category=S.scanCat;
  const res=await Recognition.identify(input);
  if(S.scan.phase!=='analysing' || S.scan.photo!==photo) return;   // cancelled
  if(!res.candidates.length){ toast(!DB.products.length?'Your catalogue is empty. Add products in Admin first.':!DB.products.some(Products.hasPhoto)?'No product has a real photo yet. Add photos in Admin.':'No matching product found. Try search.'); startScan(); render(); return; }
  S.scan.result=res; S.scan.suggested=res.count||1;
  if(res.confident && DB.settings.autoAdd!==false){
    const p=Products.get(res.candidates[0].serial), q=Math.min(res.count||1, p.stock-Billing.qtyOf(p.serial));
    if(q>=1){
      Billing.add(p.serial,q);
      const thumb=await Matcher.learn(p.serial,photo,res.feat);
      S.lastAdded={serial:p.serial,qty:q,t:Date.now(),thumb,ms:res.ms};
      startScan(); render(); tickUndo(); return;
    }
  }
  if(res.confident){ S.scan.phase='match'; S.scan.selected=res.candidates[0].serial; }
  else { S.scan.phase='choose'; S.scan.selected=null; S.scan.options=res.candidates.slice(0,3).map(c=>({serial:c.serial,conf:c.conf})); }
  render();
}

/* ---------- live camera (works on https / localhost / local file; blocked inside some embedded viewers) ---------- */
const Cam = {
  stream:null, starting:false,
  async start(){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw Object.assign(new Error('nosupport'),{name:'NoSupport'});
    this.stream = await navigator.mediaDevices.getUserMedia({audio:false, video:{facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:960}}});
    const t=this.track(); try{ await t.applyConstraints({advanced:[{exposureMode:'continuous'},{whiteBalanceMode:'continuous'},{focusMode:'continuous'}]}); }catch(e){}
    this.torch=false;
  },
  track(){ return this.stream ? this.stream.getVideoTracks()[0] : null; },
  hasTorch(){ try{ const c=this.track()?.getCapabilities?.(); return !!(c && c.torch); }catch(e){ return false; } },
  async setTorch(on){ try{ await this.track().applyConstraints({advanced:[{torch:on}]}); this.torch=on; }catch(e){ toast('Flash is not available on this camera.'); } },
  /* take 3 frames ~0.15 s apart and keep the sharpest (reduces blur from moving hands) */
  async snapBest(){ const shots=[]; for(let i=0;i<3;i++){ const u=this.snap(); if(u) shots.push(u); if(i<2) await wait(70); }
    if(!shots.length) return null; let best=shots[0], bs=-1; for(const u of shots){ const q=await photoQuality(u); if(q.sharp>bs){ bs=q.sharp; best=u; } } return best; },
  /* live hint on the viewfinder when the scene is too dark */
  watchLight(){ clearInterval(this.lightT); const c=document.createElement('canvas'); c.width=c.height=24; const x=c.getContext('2d',{willReadFrequently:true});
    this.lightT=setInterval(()=>{ const v=$('#vfVideo'), tag=$('#vfTag'); if(!v||!tag||!v.videoWidth) return; x.drawImage(v,0,0,24,24); const d=x.getImageData(0,0,24,24).data; let m=0; for(let i=0;i<d.length;i+=4) m+=.299*d[i]+.587*d[i+1]+.114*d[i+2]; m/=576*255;
      tag.textContent = m<.18 ? (this.hasTorch()&&!this.torch?'Low light: tap ⚡ for flash, or move closer to light':'Low light: move closer to light (it will still be brightened)') : 'Keep the item inside the box, then tap the button'; tag.classList.toggle('warn',m<.18); },900); },
  stop(){ clearInterval(this.lightT); if(this.stream) this.stream.getTracks().forEach(t=>t.stop()); this.stream=null; this.torch=false; },
  attach(){ const v=$('#vfVideo'); if(v && this.stream && v.srcObject!==this.stream){ v.srcObject=this.stream; v.play().catch(()=>{}); } },
  /* only the part inside the guide box is read, downscaled to 320 px, so the background is ignored and it is fast */
  snap(){ const v=$('#vfVideo'); if(!v || !v.videoWidth) return null;
    const vr=v.getBoundingClientRect(), g=$('#vfGuide'), gr=g?g.getBoundingClientRect():null;
    const s=Math.max(vr.width/v.videoWidth, vr.height/v.videoHeight), ox=(vr.width-v.videoWidth*s)/2, oy=(vr.height-v.videoHeight*s)/2;
    let sx=0, sy=0, sw=v.videoWidth, sh=v.videoHeight;
    if(gr && gr.width){ sx=(gr.left-vr.left-ox)/s; sy=(gr.top-vr.top-oy)/s; sw=gr.width/s; sh=gr.height/s; }
    sx=Math.max(0,sx); sy=Math.max(0,sy); sw=Math.min(sw,v.videoWidth-sx); sh=Math.min(sh,v.videoHeight-sy);

function readFile(f){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(f); }); }
function loadImg(src){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; }); }
async function downscale(src,max){ const i=await loadImg(src); const k=Math.min(1,max/Math.max(i.width,i.height)); const c=document.createElement('canvas'); c.width=Math.round(i.width*k); c.height=Math.round(i.height*k); c.getContext('2d').drawImage(i,0,0,c.width,c.height); return c.toDataURL('image/jpeg',.82); }
async function avgColor(src){ const i=await loadImg(src); const c=document.createElement('canvas'); c.width=c.height=24; const x=c.getContext('2d'); x.drawImage(i,0,0,24,24); const d=x.getImageData(0,0,24,24).data; let r=0,g=0,b=0,n=0; for(let j=0;j<d.length;j+=4){ r+=d[j]; g+=d[j+1]; b+=d[j+2]; n++; } return [r/n,g/n,b/n]; }
async function onScanFile(e){

  catch(err){ toast('Could not read that image. Try another photo.'); }
}
